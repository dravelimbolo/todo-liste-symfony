services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: sh -c "mkdir -p var/cache var/log && chown -R www-data:www-data var/ && php-fpm"
    volumes:
      - .:/var/www/html
      - symfony_var:/var/www/html/var
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://symfony:symfony@database:3306/todo_liste?serverVersion=8.0&charset=utf8mb4"
      MAILER_DSN: "smtp://mailpit:1025"
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo_liste
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
  symfony_var: